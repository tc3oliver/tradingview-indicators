<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M2-H Backtest Report</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#262d36; --tx:#e6edf3; --dim:#8b949e;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --acc:#58a6ff; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--tx); font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:14px; align-items:baseline }
  h1 { font-size:15px; margin:0; letter-spacing:.09em }
  a { color:var(--acc) }
  main { padding:14px; max-width:1400px }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px }
  h2 { font-size:11px; letter-spacing:.13em; color:var(--dim); margin:0 0 12px; font-weight:600 }
  table { width:100%; border-collapse:collapse; font-size:12px }
  th { text-align:left; color:var(--dim); font-weight:600; padding:4px 8px 6px 0; border-bottom:1px solid var(--line) }
  td { padding:3px 8px 3px 0; font-variant-numeric:tabular-nums }
  td.num, th.num { text-align:right }
  .ok{color:var(--ok)} .bad{color:var(--bad)} .dim{color:var(--dim)} .warn{color:var(--warn)}
  .big { font-size:24px }
  .banner { padding:11px 14px; border-radius:6px; border:1px solid var(--line); background:#12171e; margin-bottom:12px; line-height:1.6 }
  .banner.bad { border-color:var(--bad) } .banner.warn { border-color:var(--warn) }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 18px; font-size:12px }
  .kv div:nth-child(odd) { color:var(--dim) }
  .note { color:var(--dim); font-size:11px; margin-top:9px; line-height:1.55 }
</style>
</head>
<body>
<header>
  <h1>M2-H BACKTEST REPORT</h1>
  <span class="dim">historical order-book study · BTCUSDT · Binance USDⓈ-M</span>
  <a href="/">← replay</a>
</header>
<main id="root"><p class="dim" style="padding:12px">loading…</p></main>

<script>
const bp = (x, d = 3) => (Number.isFinite(x) ? x.toFixed(d) + ' bp' : '—');
const f2 = (x, d = 2) => (Number.isFinite(x) ? x.toFixed(d) : '—');
const pc = (x, d = 1) => (Number.isFinite(x) ? (100 * x).toFixed(d) + '%' : '—');
const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));

function table(head, rows) {
  return `<table><tr>${head.map((h, i) => `<th class="${i ? 'num' : ''}">${h}</th>`).join('')}</tr>`
    + rows.map((r) => `<tr>${r.map((c, i) => `<td class="${i ? 'num' : ''}">${c}</td>`).join('')}</tr>`).join('') + '</table>';
}

(async () => {
  const r = await (await fetch('/api/research')).json();
  const root = document.getElementById('root');
  if (!r.available) {
    root.innerHTML = `<section><h2>No report</h2><p>${esc(r.reason || 'not generated')}</p></section>`;
    return;
  }
  const H = [];
  const blocked = r.acceptanceEligible === false;
  H.push(`<div class="banner ${blocked ? 'warn' : r.historicalPass ? '' : 'bad'}">
    <b class="big ${blocked ? 'warn' : r.historicalPass ? 'ok' : 'bad'}">${esc(r.status)}</b><br>
    ${blocked ? esc(r.coverage.reason) + '<br><b>These numbers cannot produce a PASS.</b> The pre-registration forbids treating free-tier sample days as the acceptance dataset.'
      : r.historicalPass ? 'A directional model passed the historical gates. It is <b>RETROSPECTIVE PASS / PROSPECTIVE COLLECTING</b> until live capture confirms it — not "validated".'
      : 'No directional model passed. The Execution Planner remains useful; no LONG/SHORT is produced.'}
  </div>`);

  H.push(`<section><h2>Study</h2><div class="kv">
    <div>provider</div><div>${esc(r.provider)} · ${esc(r.exchange)} · ${esc(r.symbol)}</div>
    <div>acceptance window</div><div>${esc(r.splits.dev[0])} → ${esc(r.splits.test[1])} (${r.coverage.requiredDays} days)</div>
    <div>days in store</div><div>${r.coverage.daysInWindow} (${f2(r.coverage.coveragePctOfWindow, 1)}% of the window) — dev ${r.coverage.bySplit.dev} · val ${r.coverage.bySplit.val} · test ${r.coverage.bySplit.test}</div>
    <div>1-second rows</div><div>${(r.coverage.totalRows || 0).toLocaleString()}</div>
    <div>valid-book coverage</div><div>${f2(r.coverage.meanValidBookCoveragePct, 2)}% mean per day</div>
    <div>archives read</div><div>${(r.coverage.archiveBytes / 1073741824).toFixed(1)} GB → ${(r.coverage.storeBytes / 1048576).toFixed(0)} MB feature store</div>
    <div>generated</div><div>${esc(r.generated)}</div>
  </div></section>`);

  const feats = Object.keys(r.gates || {});
  H.push(`<section><h2>Information — 30 s forward mid return</h2>` + table(
    ['feature', 'dev β (t)', 'val β (t)', 'test β (t)', 'val∪test β (t)', 'rank IC', 'decile mono', 'top−bottom'],
    feats.map((f) => {
      const per = r.results[f]['30s'], d = r.results[f].deciles;
      const c = (x) => (x ? `${x.beta.toExponential(2)} (${f2(x.t)})` : '—');
      return [f, c(per.dev), c(per.val), c(per.test), c(per.valtest), f2(per.valtest?.rankIC, 4), f2(d?.mono), bp(d?.topMinusBottomBp)];
    })) + `<p class="note">Non-overlapping observations at the horizon step, hour-of-day fixed effects, controls for the previous 30 s return, spread and log near-touch depth, Newey–West at 60 s. Target is the future <b>mid</b>, never last trade.</p></section>`);

  H.push(`<section><h2>Gates</h2>` + table(
    ['feature', 'G1 sign stable', 'G2 |t|≥2 val &amp; test', 'G3 multiple testing', 'G4 monotonicity', 'G5 economic', 'verdict'],
    feats.map((f) => {
      const g = r.gates[f], y = (v) => (v === true ? '<span class="ok">pass</span>' : v === false ? '<span class="bad">FAIL</span>' : '—');
      return [f, y(g.G1_signStableAcrossSplits), y(g.G2_significantOnValAndTest), y(g.G3_multipleTesting), y(g.G4_decileMonotonicity), y(g.G5_economic),
        g.pass ? '<span class="ok">PASS</span>' : '<span class="bad">REJECTED</span>'];
    })) + `<p class="note">Multiple-testing threshold |t| &gt; ${f2(r.multipleTestingT)} at ${f2(r.cumulativeEffectiveN, 1)} cumulative effective trials across every study in this repository.</p></section>`);

  const e0 = Object.values(r.economics || {})[0];
  H.push(`<section><h2>Economics — gross edge against the cost of trading it</h2>` + table(
    ['feature', 'gross edge', 'A: commission + measured book cost', 'B: 14 bp', 'C: 20 bp', 'cost / edge (B)', 'tradable'],
    Object.entries(r.economics || {}).map(([f, e]) => [f, bp(e.grossEdgeBp),
      bp(e.profiles.A.netEdgeBp), bp(e.profiles.B.netEdgeBp), bp(e.profiles.C.netEdgeBp),
      f2(e.profiles.B.costOverEdge, 1) + '×',
      e.economicallyTradable ? '<span class="ok">yes</span>' : '<span class="bad">no</span>']))
    + `<p class="note">Measured half-spread plus book impact for a $10,000 order: <b>${bp(e0?.measuredHalfSpreadPlusImpactBp)}</b> per side, from the reconstructed book. Gross edge basis: ${esc(e0?.basis || '')}. The maker profile is recorded but may never pass a gate: a resting order is not a fill.</p></section>`);

  H.push(`<section><h2>Walk-the-book backtest — ${esc(r.backtestBasis || '')}</h2>` + table(
    ['candidate', 'trades', 'gross/trade', 'net/trade', 'win', 'PF', 'Sharpe', 'max DD', 'ex-best-5%', 'long', 'short'],
    Object.entries(r.backtests || {}).map(([f, b]) => {
      const m = b.primary;
      if (!m.trades) return [f, '0', '—', '—', '—', '—', '—', '—', '—', '—', '—'];
      const cls = m.netBpPerTrade > 0 ? 'ok' : 'bad';
      return [f, m.trades.toLocaleString(), bp(m.grossBpPerTrade), `<span class="${cls}">${bp(m.netBpPerTrade)}</span>`,
        pc(m.winRate), f2(m.profitFactor), f2(m.sharpe, 1), f2(m.maxDrawdownBp, 0) + ' bp',
        bp(m.netBpPerTradeExBest5pct), bp(m.long?.meanBp), bp(m.short?.meanBp)];
    })) + `<p class="note">Signal at second <i>t</i>, entry at the next executable second, exit 30 s later, both priced by walking the reconstructed book — not mid to mid. No stop, no target, no overlapping positions. Commission 5 bp per side.</p></section>`);

  const yrs = new Set();
  for (const b of Object.values(r.backtests || {})) for (const y of Object.keys(b.primary?.byYear || {})) yrs.add(y);
  const years = [...yrs].sort();
  if (years.length) {
    H.push(`<section><h2>Year by year — net bp per trade</h2>` + table(
      ['candidate', ...years],
      Object.entries(r.backtests).map(([f, b]) => [f, ...years.map((y) => {
        const v = b.primary?.byYear?.[y];
        return v ? `<span class="${v.meanBp > 0 ? 'ok' : 'bad'}">${bp(v.meanBp, 2)}</span><span class="dim"> (${v.n})</span>` : '—';
      })])) + `<p class="note">A candidate that is negative early and positive late is rejected as regime dependent, however good the recent part looks.</p></section>`);
  }

  H.push(`<section><h2>Baselines</h2>` + table(['baseline', 'trades', 'net/trade', 'PF'],
    Object.entries(r.baselines || {}).map(([k, m]) => [k, (m.trades || 0).toLocaleString(), bp(m.netBpPerTrade), f2(m.profitFactor)]))
    + `<p class="note">Absolute PnL means nothing on its own. Random entries at the same frequency, the sign-shuffled signal, and the M1 raw-AFI reversal are all run through the identical execution model.</p></section>`);

  const ex = r.execution;
  if (ex) {
    const rows = [];
    for (const [label, block] of [['$10k', ex.primary], ['$50k', ex.secondary]]) {
      for (const side of ['BUY', 'SELL']) {
        const e = block[side], w5 = e.waitMinusImmediate[5], w30 = e.waitMinusImmediate[30];
        rows.push([`${side} ${label}`, bp(e.immediate.mean), `${bp(w5.mean)} (t ${f2(w5.t)})`, `${bp(w30.mean)} (t ${f2(w30.t)})`,
          bp(w30.p95AdverseTail), w30.materiallyBetterToActNow ? 'act now' : w30.materiallyBetterToWait ? 'wait' : 'no']);
      }
    }
    H.push(`<section><h2>Execution study — immediate versus waiting</h2>`
      + table(['side / size', 'immediate shortfall', 'wait 5 s − now', 'wait 30 s − now', 'p95 adverse (30 s)', 'material?'], rows)
      + `<p class="note">This half needs no directional edge and can pass on its own. A timing rule counts as useful only if it moves expected implementation shortfall by more than 0.5 bp with |t| &gt; 2, or materially cuts the adverse tail. Queue model for maker execution: <b>${esc(ex.toxicity.queueModel)}</b></p></section>`);
  }
  root.innerHTML = H.join('');
})();
</script>
</body>
</html>
